<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>French Radio Player</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        .info {
            text-align: center;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        .video-container {
            width: 100%;
            height: 540px; /* Fixed height: 16:9 ratio for 960px width */
            background: #000;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 8px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 50px; /* Fixed height for controls */
        }
        button {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .playlist {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .segment {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .segment:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .segment.playing {
            background: #2980b9;
            font-weight: bold;
        }
        .time {
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇫🇷 France Info Radio</h1>
        <div class="info">Live French radio with burned-in dual subtitles • 6 hour rewind</div>
        
        <div class="video-container">
            <video id="player" controls></video>
        </div>
        
        <div class="controls">
            <button onclick="playPrevious()">⏮ Previous</button>
            <button onclick="goLive()">🔴 Jump to Live</button>
            <button onclick="playNext()">⏭ Next</button>
        </div>
        
        <div class="playlist" id="playlist"></div>
    </div>

    <script>
        const player = document.getElementById('player');
        const playlistEl = document.getElementById('playlist');
        let segments = [];
        let currentIndex = -1;

        // Load playlist
        async function loadPlaylist() {
            try {
                const response = await fetch('playlist/segments.json');
                const data = await response.json();
                segments = data.segments || [];
                renderPlaylist();
                
                // If nothing playing, start with latest
                if (currentIndex === -1 && segments.length > 0) {
                    playSegment(segments.length - 1);
                }
            } catch (e) {
                console.error('Failed to load playlist:', e);
            }
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            
            if (segments.length === 0) {
                playlistEl.innerHTML = '<div style="text-align: center; opacity: 0.5;">No segments available</div>';
                return;
            }
            
            segments.forEach((seg, i) => {
                const div = document.createElement('div');
                div.className = 'segment';
                if (i === currentIndex) div.classList.add('playing');
                
                const date = new Date(seg.timestamp * 1000);
                const timeStr = date.toLocaleTimeString();
                
                div.innerHTML = `
                    <div>${seg.basename}</div>
                    <div class="time">${timeStr}</div>
                `;
                div.onclick = () => playSegment(i);
                playlistEl.appendChild(div);
            });
            
            // Scroll playing segment into view
            if (currentIndex >= 0) {
                const playingEl = playlistEl.children[currentIndex];
                if (playingEl) {
                    playingEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function playSegment(index) {
            if (index < 0 || index >= segments.length) return;
            currentIndex = index;
            const seg = segments[index];
            player.src = `videos_with_subs/${seg.file}`;
            player.play();
            renderPlaylist();
        }

        function playNext() {
            if (currentIndex < segments.length - 1) {
                playSegment(currentIndex + 1);
            }
        }

        function playPrevious() {
            if (currentIndex > 0) {
                playSegment(currentIndex - 1);
            }
        }

        function goLive() {
            if (segments.length > 0) {
                playSegment(segments.length - 1);
            }
        }

        // Auto-advance to next segment
        player.addEventListener('ended', () => {
            playNext();
        });

        // Initial load and periodic refresh
        loadPlaylist();
        setInterval(loadPlaylist, 15000); // Refresh every 15 seconds
    </script>
</body>
</html>

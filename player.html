<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>French Radio Player</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        .info {
            text-align: center;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        .video-container {
            width: 100%;
            height: 540px;
            background: #000;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 8px;
        }
        .debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 50px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .speed-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .speed-btn {
            padding: 8px 15px;
            font-size: 14px;
        }
        .speed-btn.active {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }
        .speed-label {
            font-size: 14px;
            opacity: 0.8;
            margin-right: 10px;
        }
        .playlist {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .segment {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .segment:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .segment.playing {
            background: #2980b9;
            font-weight: bold;
        }
        .time {
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇫🇷 France Info Radio</h1>
        <div class="info">Live French radio with burned-in dual subtitles • 6 hour rewind</div>
        
        <div class="video-container">
            <video id="player" controls preload="auto"></video>
            <div class="debug-info" id="debug">
                Loading...
            </div>
        </div>
        
        <div class="controls">
            <button onclick="playPrevious()">⏮ Previous</button>
            <button onclick="goLive()">🔴 Jump to Live</button>
            <button onclick="playNext()">⏭ Next</button>
        </div>
        
        <div class="controls">
            <span class="speed-label">Playback Speed:</span>
            <div class="speed-controls">
                <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                <button class="speed-btn" onclick="setSpeed(0.75)">0.75x</button>
                <button class="speed-btn active" onclick="setSpeed(1.0)" id="speed-1">1.0x</button>
                <button class="speed-btn" onclick="setSpeed(1.25)">1.25x</button>
                <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
            </div>
        </div>
        
        <div class="playlist" id="playlist"></div>
    </div>

    <script>
        const player = document.getElementById('player');
        const playlistEl = document.getElementById('playlist');
        const debugEl = document.getElementById('debug');
        let segments = [];
        let currentIndex = -1;
        let currentSpeed = 1.0;

        // Debug info updater
        function updateDebug() {
            if (player.duration) {
                debugEl.innerHTML = `
                    Current: ${player.currentTime.toFixed(2)}s / ${player.duration.toFixed(2)}s<br>
                    Buffered: ${player.buffered.length > 0 ? player.buffered.end(0).toFixed(2) : 0}s<br>
                    Ready State: ${player.readyState}<br>
                    Network State: ${player.networkState}<br>
                    Paused: ${player.paused}
                `;
            }
        }

        // Update debug every 500ms
        setInterval(updateDebug, 500);

        // Log seeking events
        player.addEventListener('seeking', () => {
            console.log('Seeking to:', player.currentTime);
            debugEl.style.background = 'rgba(255,165,0,0.7)'; // Orange when seeking
        });

        player.addEventListener('seeked', () => {
            console.log('Seeked to:', player.currentTime);
            debugEl.style.background = 'rgba(0,0,0,0.7)'; // Back to normal
        });

        player.addEventListener('loadedmetadata', () => {
            console.log('Metadata loaded, duration:', player.duration);
        });

        player.addEventListener('canplay', () => {
            console.log('Can play');
        });

        player.addEventListener('error', (e) => {
            console.error('Video error:', e, player.error);
            debugEl.innerHTML = 'ERROR: ' + (player.error ? player.error.message : 'Unknown');
            debugEl.style.background = 'rgba(255,0,0,0.7)';
        });

        // Set playback speed
        function setSpeed(speed) {
            currentSpeed = speed;
            player.playbackRate = speed;
            
            // Update button styling
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Load playlist
        async function loadPlaylist() {
            try {
                const response = await fetch('playlist/segments.json');
                const data = await response.json();
                segments = data.segments || [];
                renderPlaylist();
                
                // If nothing playing, start with latest
                if (currentIndex === -1 && segments.length > 0) {
                    playSegment(segments.length - 1);
                }
            } catch (e) {
                console.error('Failed to load playlist:', e);
            }
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            
            if (segments.length === 0) {
                playlistEl.innerHTML = '<div style="text-align: center; opacity: 0.5;">No segments available</div>';
                return;
            }
            
            segments.forEach((seg, i) => {
                const div = document.createElement('div');
                div.className = 'segment';
                if (i === currentIndex) div.classList.add('playing');
                
                const date = new Date(seg.timestamp * 1000);
                const timeStr = date.toLocaleTimeString();
                
                div.innerHTML = `
                    <div>${seg.basename}</div>
                    <div class="time">${timeStr}</div>
                `;
                div.onclick = () => playSegment(i);
                playlistEl.appendChild(div);
            });
            
            // Scroll playing segment into view
            if (currentIndex >= 0) {
                const playingEl = playlistEl.children[currentIndex];
                if (playingEl) {
                    playingEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function playSegment(index) {
            if (index < 0 || index >= segments.length) return;
            currentIndex = index;
            const seg = segments[index];
            player.src = `videos_with_subs/${seg.file}`;
            player.load(); // Force reload
            player.playbackRate = currentSpeed;
            player.play().catch(e => console.error('Play failed:', e));
            renderPlaylist();
        }

        function playNext() {
            if (currentIndex < segments.length - 1) {
                playSegment(currentIndex + 1);
            }
        }

        function playPrevious() {
            if (currentIndex > 0) {
                playSegment(currentIndex - 1);
            }
        }

        function goLive() {
            if (segments.length > 0) {
                playSegment(segments.length - 1);
            }
        }

        // Auto-advance to next segment
        player.addEventListener('ended', () => {
            playNext();
        });

        // Initial load and periodic refresh
        loadPlaylist();
        setInterval(loadPlaylist, 15000);
    </script>
</body>
</html>
